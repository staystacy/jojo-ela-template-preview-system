<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bitable mode translator tests</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    h1 { color: #333; }
    .stats { margin-bottom: 16px; padding: 12px; background: #f0f0f0; border-radius: 6px; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 12px; margin-bottom: 4px; border-radius: 4px; font-family: "Fira Code", monospace; font-size: 13px; }
    li.pass { background: #d4edda; color: #155724; }
    li.fail { background: #f8d7da; color: #721c24; }
    li pre { margin-top: 8px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Bitable Mode Translator — K-1_U01 fixtures</h1>
  <div class="stats" id="stats">Running...</div>
  <ul id="results"></ul>

  <script src="../renderers/renderer-base.js"></script>
  <script src="bitable-mode.js"></script>
  <script>
  /* eslint-disable */

        { topicId:2, topicNumber:2, topicType:"english_sound_box_full",

        { topicId:3, topicNumber:3, topicType:"english_sound_box_full",

        { topicType:"english_picture_spelling", word:"pan", answer:"pan", source_trace:"content_pool.decodable_words[7]" },

        { topicType:"english_circle_picture", options:["bat","gap","van"], correctWords:["gap"], source_trace_map:{} },

    },

      englishLetterTopicList: [
        { topicType:"english_matching", matchType:"picture_to_word",
          topItems:    [{id:"t1",value:"dad"},{id:"t2",value:"cat"},{id:"t3",value:"hat"},{id:"t4",value:"bat"}],
          bottomItems: [{id:"b1",value:"hat"},{id:"b2",value:"bat"},{id:"b3",value:"dad"},{id:"b4",value:"cat"}],
          correctPairs:["t1-b3","t2-b4","t3-b1","t4-b2"],
          source_trace_map:{
            "topItems[0].value":"content_pool.decodable_words[12]",
            "topItems[1].value":"content_pool.decodable_words[0]",
            "topItems[2].value":"content_pool.decodable_words[1]",
            "topItems[3].value":"content_pool.decodable_words[3]"

        }
      ]
    },
    p5: {
      pageNumber: 5, instructionId:"instr_listen_word_fill_missing",
      instructionText:"Listen to the word. Fill in the missing sound.",
      englishLetterTopicList: [
        { topicType:"english_sound_box_partial_fill", word:"fan", blankBefore:"",  blankAfter:"an", answer:"f",
          source_trace:"content_pool.decodable_words[2]" },
        { topicType:"english_sound_box_partial_fill", word:"van", blankBefore:"v", blankAfter:"n",  answer:"a",
          source_trace:"content_pool.decodable_words[5]" },
        { topicType:"english_sound_box_partial_fill", word:"cap", blankBefore:"ca",blankAfter:"",   answer:"p",
          source_trace:"content_pool.decodable_words[9]" },
        { topicType:"english_sound_box_partial_fill", word:"dad", blankBefore:"d", blankAfter:"d",  answer:"a",
          source_trace:"content_pool.decodable_words[12]" }
      ]
    },
    initialSound: {
      pageId: 80173, pageNumber: 1,
      instructionText: "Look at the picture. Listen to the word. Write the first letter.",
      instructionKey: "look_at_the_picture_listen_to_the_word_write_the_first_letter",
      englishLetterTopicList: [
        { topicId:1, topicNumber:1, topicType:"english_initial_sound_spelling",
          word:"banana", displaySuffix:"anana", answer:"b" },
        { topicId:2, topicNumber:2, topicType:"english_initial_sound_spelling",
          word:"butterfly", displaySuffix:"utterfly", answer:"b" },
        { topicId:3, topicNumber:3, topicType:"english_initial_sound_spelling",
          word:"duck", displaySuffix:"uck", answer:"d" },
        { topicId:4, topicNumber:4, topicType:"english_initial_sound_spelling",
          word:"elephant", displaySuffix:"lephant", answer:"e" }
      ]
    },
    circlePictureSingle: {
      pageId: 30205, pageNumber: 5,
      instructionText: "Listen to the sound. Circle the picture that starts with that sound.",
      instructionKey: "listen_to_the_sound_circle_the_picture_that_starts_with_that_sound",
      englishLetterTopicList: [
        { topicId:1, topicNumber:1, topicType:"english_circle_picture",
          targetLetter:"D", targetSound:"/d/",
          options:["dog","apple","mouse","cat","egg","fish"],
          correctAnswer:"dog" }
      ]
    }
  };

  // ============ Invariant-based test runner ============
  const runner = (() => {
    let pass = 0, fail = 0;
    const ul = document.getElementById('results');
    const stats = document.getElementById('stats');
    function record(name, ok, err) {
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = (ok ? '✓ ' : '✗ ') + name + (err ? ' — ' + err : '');
      ul.appendChild(li);
      ok ? pass++ : fail++;
    }
    function check(name, fn) {
      try { fn(); record(name, true); }
      catch (e) { record(name, false, e.message); console.error(name, e); }
    }
    function done() {
      const total = pass + fail;
      stats.textContent = `${pass}/${total} passing` + (fail ? ` (${fail} failed)` : '');
      stats.style.background = fail ? '#f8d7da' : '#d4edda';
      stats.style.color = fail ? '#721c24' : '#155724';
      document.title = `Tests: ${pass}/${total}`;
    }
    return { check, done };
  })();

  function eq(actual, expected, label) {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a !== e) throw new Error(label + ': expected ' + e + ', got ' + a);
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  // ============ Tests ============

  const T = window.JOJO_BITABLE.translatePage;

  runner.check('Page 1 — sound_box_full → T-SOUNDBOX v2', () => {
    const r = T(PAGES.p1, {}, 'K-1_U01', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-SOUNDBOX', 'templateId');
    eq(r.variant, 'v2', 'variant');
    eq(r.data.instruction_text, 'Listen to the word. Write each sound in a box.', 'instr text');
    eq(r.data.instruction_audio, null, 'instr audio is null when no instructionKey in fixture');
    eq(r.data.items.length, 4, 'items.length');
    eq(r.data.items[0].image, 'cat.webp', 'item[0].image');
    eq(r.data.items[0].audio, 'cat.mp3', 'item[0].audio');
    eq(r.data.items[0].phonemes, ['c','a','t'], 'item[0].phonemes');
    eq(r.data.items[0].prefill, ['','',''], 'item[0].prefill (full blank)');
    eq(r.data.items[0].boxes, 3, 'item[0].boxes');
    eq(r.sourceTraces[0], 'content_pool.decodable_words[0]', 'sourceTraces[0]');
    eq(r.sourceTraces[3], 'content_pool.decodable_words[4]', 'sourceTraces[3]');
  });

  runner.check('Page 2 — picture_spelling → T-WRITE v2', () => {
    const r = T(PAGES.p2, {}, 'K-1_U01', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-WRITE', 'templateId');
    eq(r.variant, 'v2', 'variant');
    eq(r.data.items.length, 4, 'items.length');
    eq(r.data.items[0].prompt_image, 'fan.webp', 'item[0].prompt_image');
    eq(r.data.items[0].prompt_audio, 'fan.mp3', 'item[0].prompt_audio');
    eq(r.data.items[0].answer, 'fan', 'item[0].answer');
    eq(r.data.items[3].answer, 'cap', 'item[3].answer');
    eq(r.sourceTraces[0], 'content_pool.decodable_words[2]', 'sourceTraces[0]');
  });

  runner.check('Page 3 — circle_picture → circle_multi 4 rows', () => {
    const r = T(PAGES.p3, {}, 'K-1_U01', 'K');
    eq(r.kind, 'circle_multi', 'kind');
    eq(r.rows.length, 4, 'rows.length');
    eq(r.rows[0].options, ['yak','cat','mat'], 'row[0].options');
    eq(r.rows[0].correct, ['yak'], 'row[0].correct');
    eq(r.rows[1].correct, ['nap'], 'row[1].correct');
    eq(r.rows[2].correct, ['gap'], 'row[2].correct');
    eq(r.rows[3].correct, ['yam'], 'row[3].correct');
    eq(r.rows[0].sourceTraceMap['options[0]'], 'content_pool.decodable_words[6]', 'row[0] sourceTraceMap');
    eq(r.ctx.instructionText, 'Listen to the word. Circle the picture.', 'instructionText');
  });

  runner.check('Page 4 — matching → T-MATCH v2 (image left, word right)', () => {
    const r = T(PAGES.p4, {}, 'K-1_U01', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-MATCH', 'templateId');
    eq(r.variant, 'v2', 'variant');
    eq(r.data.pairs.length, 4, 'pairs.length');
    eq(r.data.pairs[0].left,  { content:'dad.webp', type:'image', audio:'dad.mp3' }, 'pair[0].left');
    eq(r.data.pairs[0].right, { content:'dad', type:'word' }, 'pair[0].right');
    eq(r.data.pairs[1].left.content, 'cat.webp', 'pair[1].left.content');
    eq(r.data.pairs[2].left.content, 'hat.webp', 'pair[2].left.content');
    eq(r.data.pairs[3].left.content, 'bat.webp', 'pair[3].left.content');
    eq(r.sourceTraces[0], 'content_pool.decodable_words[12]', 'sourceTraces[0] (dad)');
  });

  runner.check('Page 5 — sound_box_partial_fill → T-SOUNDBOX v1 with blank position math', () => {
    const r = T(PAGES.p5, {}, 'K-1_U01', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-SOUNDBOX', 'templateId');
    eq(r.variant, 'v1', 'variant');
    eq(r.data.items.length, 4, 'items.length');
    // fan: blankBefore="" answer="f" blankAfter="an" → phonemes=[f,a,n], prefill=['',a,n]
    eq(r.data.items[0].phonemes, ['f','a','n'], 'fan.phonemes');
    eq(r.data.items[0].prefill,  ['', 'a','n'], 'fan.prefill');
    eq(r.data.items[0].boxes, 3, 'fan.boxes');
    // van: blankBefore="v" answer="a" blankAfter="n" → phonemes=[v,a,n], prefill=[v,'',n]
    eq(r.data.items[1].phonemes, ['v','a','n'], 'van.phonemes');
    eq(r.data.items[1].prefill,  ['v','', 'n'], 'van.prefill');
    // cap: blankBefore="ca" answer="p" blankAfter="" → phonemes=[c,a,p], prefill=[c,a,'']
    eq(r.data.items[2].phonemes, ['c','a','p'], 'cap.phonemes');
    eq(r.data.items[2].prefill,  ['c','a',''],  'cap.prefill');
    // dad: blankBefore="d" answer="a" blankAfter="d" → phonemes=[d,a,d], prefill=[d,'',d]
    eq(r.data.items[3].phonemes, ['d','a','d'], 'dad.phonemes');
    eq(r.data.items[3].prefill,  ['d','', 'd'], 'dad.prefill');
  });

  runner.check('Uses topicType default instruction when instructionText missing', () => {
    const page = { ...PAGES.p1, instructionText: undefined };
    const r = T(page, {}, 'K-1_U01', 'K');
    assert(r.ctx.instructionFallback === false, 'fallback flag stays false when default applies');
    assert(r.ctx.instructionText === 'Listen to the word. Write each sound in a box.',
      'instructionText comes from TOPIC_DEFAULT_INSTR');
  });

  runner.check('Falls back to instructionId when both instructionText and default missing', () => {
    const page = {
      pageNumber: 99,
      instructionId: 'instr_made_up',
      englishLetterTopicList: [{ topicType: 'english_no_such_default', word: 'x' }]
    };
    const r = T(page, {}, 'K-1a_U01', 'K');
    assert(r.ctx.instructionFallback === true, 'fallback flag set');
    assert(r.ctx.instructionText === 'instr_made_up', 'falls back to id');
  });

  runner.check('Mixed topicTypes → unsupported', () => {
    const page = {
      pageNumber: 99,
      instructionText: 'mixed',
      englishLetterTopicList: [
        { topicType: 'english_sound_box_full', word:'cat', answer:['c','a','t'] },
        { topicType: 'english_picture_spelling', word:'fan', answer:'fan' }
      ]
    };
    const r = T(page, {}, 'K-1_U01', 'K');
    eq(r.kind, 'unsupported', 'kind');
    assert(/mixed/.test(r.reason), 'reason mentions mixed');
  });

  runner.check('Unknown topicType → unsupported', () => {
    const page = {
      pageNumber: 99, instructionText: 'unknown',
      englishLetterTopicList: [{ topicType: 'english_imagined_new_type', word:'x' }]
    };
    const r = T(page, {}, 'K-1_U01', 'K');
    eq(r.kind, 'unsupported', 'kind');
    assert(/unknown topicType/.test(r.reason), 'reason mentions unknown');
  });

  runner.check('Empty topic list → unsupported', () => {
    const r = T({ pageNumber: 99, instructionText:'empty', englishLetterTopicList: [] }, {}, 'K-1_U01', 'K');
    eq(r.kind, 'unsupported', 'kind');
  });

  // ============ templateMeta assertions (Phase 2) ============

  runner.check('Page 1 templateMeta → T-SOUNDBOX › Sound Box - Full (2 Rows)', () => {
    const r = T(PAGES.p1, {}, 'K-1_U01', 'K');
    eq(r.templateMeta, { templateId: 'T-SOUNDBOX', variantNumber: 2, variantName: 'Sound Box - Full (2 Rows)' }, 'templateMeta');
  });

  runner.check('Page 2 templateMeta → T-SPELL › Picture Spelling (4 Cells)', () => {
    const r = T(PAGES.p2, {}, 'K-1_U01', 'K');
    eq(r.templateMeta, { templateId: 'T-SPELL', variantNumber: 2, variantName: 'Picture Spelling (4 Cells)' }, 'templateMeta');
  });

  runner.check('Page 3 templateMeta single-correct → T-CIRCLE › Circle Picture by Sound (3 Cards, Single Choice)', () => {
    const r = T(PAGES.p3, {}, 'K-1_U01', 'K');
    eq(r.templateMeta, { templateId: 'T-CIRCLE', variantNumber: 1, variantName: 'Circle Picture by Sound (3 Cards, Single Choice)' }, 'templateMeta');
  });

  runner.check('Page 4 templateMeta picture_to_word → T-MATCH › Match Picture to Word (4 Pairs)', () => {
    const r = T(PAGES.p4, {}, 'K-1_U01', 'K');
    eq(r.templateMeta, { templateId: 'T-MATCH', variantNumber: 2, variantName: 'Match Picture to Word (4 Pairs)' }, 'templateMeta');
  });

  runner.check('instructionKey → audio filename = "<key>.mp3" (Bitable Resource Library alignment)', () => {
    const r = T(PAGES.blend, {}, 'K-1a_U01', 'K');
    // PAGES.blend's topic carries instructionKey="tap_each_sound_blend_them_together_write_the_word"
    eq(r.data.instruction_audio,
       'tap_each_sound_blend_them_together_write_the_word.mp3',
       'instruction_audio is just <key>.mp3 (fallback layer adds /assets/audio/instruction/ prefix)');
  });

  runner.check('letter_case match → text on BOTH sides (no images)', () => {
    const page = {
      pageNumber: 99, instructionText: 'Find its matching form.',
      englishLetterTopicList: [{
        topicType: 'english_matching',
        matchType: 'letter_case',
        topItems:    [{id:'t1',value:'D'},{id:'t2',value:'E'},{id:'t3',value:'F'},{id:'t4',value:'A'}],
        bottomItems: [{id:'b1',value:'f'},{id:'b2',value:'a'},{id:'b3',value:'d'},{id:'b4',value:'e'}],
        correctPairs: ['t1-b3','t2-b4','t3-b1','t4-b2']
      }]
    };
    const r = T(page, {}, 'PK-1a_U02', 'PreK');
    eq(r.kind, 'legacy', 'kind');
    eq(r.data.pairs.length, 4, 'pairs.length');
    eq(r.data.pairs[0].left.type,  'word', 'left.type for letter_case');
    eq(r.data.pairs[0].left.content, 'D',  'left.content stays as letter');
    eq(r.data.pairs[0].right.type, 'word', 'right.type');
    eq(r.data.pairs[0].right.content, 'd', 'right.content');
    eq(r.templateMeta.variantName, 'Match Letter Case (4 Pairs)', 'variant');
  });

  runner.check('Page 5 templateMeta → T-SOUNDBOX › Sound Box - Partial Fill (4 Rows, 2x2)', () => {
    const r = T(PAGES.p5, {}, 'K-1_U01', 'K');
    eq(r.templateMeta, { templateId: 'T-SOUNDBOX', variantNumber: 1, variantName: 'Sound Box - Partial Fill (4 Rows, 2x2)' }, 'templateMeta');
  });

  runner.check('Circle multi-correct → T-CIRCLE › Circle Pictures by Digraph (4 Cards, Multi-Select)', () => {
    const page = {
      pageNumber: 99, instructionText: 'digraph circle',
      englishLetterTopicList: [
        { topicType:'english_circle_picture', options:['ship','chip','chess','sash'], correctWords:['ship','sash'], source_trace_map:{} }
      ]
    };
    const r = T(page, {}, 'K-1_U01', 'K');
    eq(r.templateMeta, { templateId: 'T-CIRCLE', variantNumber: 2, variantName: 'Circle Pictures by Digraph (4 Cards, Multi-Select)' }, 'templateMeta');
  });

  runner.check('K-1a U01 P1 trace_word → T-TRACE renderer with 4 trace cells', () => {
    const r = T(PAGES.trace, {}, 'K-1a_U01', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-TRACE', 'templateId');
    eq(r.variant, 'v2', 'variant');
    eq(r.data.cells.length, 4, 'cells.length');
    eq(r.data.cells.map(c => c.scaffold), ['trace','trace','trace','trace'], 'scaffolds');
    eq(r.data.cells.map(c => c.content), ['cat','hat','map','bag'], 'cell contents');
    eq(r.data.demo_area.content, 'cat', 'demo content');
    eq(r.data.demo_area.image, 'cat.webp', 'demo image');
    eq(r.templateMeta, { templateId: 'T-TRACE', variantNumber: 8, variantName: 'Shadow Writing - Word (4 Cells)' }, 'templateMeta');
  });

  runner.check('K-1a U01 P3 onset_rime_blend → T-BLEND with phoneme labels', () => {
    const r = T(PAGES.blend, {}, 'K-1a_U01', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-BLEND', 'templateId');
    eq(r.variant, 'v1', 'variant');
    eq(r.data.items.length, 2, 'items.length');
    eq(r.data.items[0].phoneme_labels, ['/c/', '/at/'], 'items[0].phoneme_labels');
    eq(r.data.items[0].phoneme_audios, ['c.mp3', 'at.mp3'], 'items[0].phoneme_audios');
    eq(r.data.items[0].image, 'cat.webp', 'items[0].image');
    eq(r.data.items[0].answer, 'cat', 'items[0].answer');
    eq(r.data.instruction_text, 'Tap each sound. Blend them together. Write the word.', 'instr from topic-level');
    eq(r.templateMeta, { templateId: 'T-BLEND', variantNumber: 1, variantName: 'Onset-Rime Blend (2 Rows)' }, 'templateMeta');
  });

  runner.check('Trace_word guideMode "Guided to Freehand" → mixed scaffolds', () => {
    const page = JSON.parse(JSON.stringify(PAGES.trace));
    page.englishLetterTopicList[0].guideMode = 'Guided to Freehand';
    const r = T(page, {}, 'K-1a_U01', 'K');
    eq(r.data.cells.map(c => c.scaffold), ['trace','trace','faded','faded'], 'guided-to-freehand scaffolds');
    eq(r.templateMeta.variantNumber, 9, 'variantNumber 9');
  });

  runner.check('Trace_word guideMode "Free" → all blank + variant 10', () => {
    const page = JSON.parse(JSON.stringify(PAGES.trace));
    page.englishLetterTopicList[0].guideMode = 'Free';
    const r = T(page, {}, 'K-1a_U01', 'K');
    eq(r.data.cells.map(c => c.scaffold), ['blank','blank','blank','blank'], 'free scaffolds');
    eq(r.templateMeta.variantNumber, 10, 'variantNumber 10');
    eq(r.templateMeta.variantName, 'Freehand Writing - Word (4 Cells)', 'variantName');
  });

  runner.check('phoneme_blend_picture → T-BLEND v2 with phoneme arrays', () => {
    const r = T(PAGES.phonemeBlend, {}, 'K-1a_U04', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-BLEND', 'templateId');
    eq(r.variant, 'v2', 'variant');
    eq(r.data.items.length, 2, 'items.length');
    eq(r.data.items[0].phoneme_labels, ['/h/','/i/','/t/'], 'phoneme labels');
    eq(r.data.items[0].phoneme_audios, ['h.mp3','i.mp3','t.mp3'], 'phoneme audios');
    eq(r.data.items[0].image, 'hit.webp', 'image');
    eq(r.templateMeta, { templateId: 'T-BLEND', variantNumber: 2, variantName: 'Phoneme Blend - Picture Support (2 Rows)' }, 'templateMeta');
  });

  runner.check('word_bank_cloze → T-FILLIN v3 with word_bank + display', () => {
    const r = T(PAGES.wordBankCloze, {}, 'K-1a_U04', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-FILLIN', 'templateId');
    eq(r.variant, 'v3', 'variant');
    eq(r.data.word_bank, ['cat','pig','hat','kid'], 'word_bank flattened');
    eq(r.data.items.length, 2, 'items.length');
    eq(r.data.items[0].display, 'I see a _.', 'underscore collapsed');
    eq(r.data.items[0].blank_length, 3, 'blank_length = answer.length');
    eq(r.data.items[0].answer, 'cat', 'answer');
    eq(r.templateMeta, { templateId: 'T-FILLIN', variantNumber: 1, variantName: 'Word Bank Cloze (2 Rows)' }, 'templateMeta');
  });

  runner.check('find_word → T-FINDWORD v1 with lowercased grid + targets', () => {
    const r = T(PAGES.findWord, {}, 'K-1a_U05', 'K');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-FINDWORD', 'templateId');
    eq(r.variant, 'v1', 'variant');
    eq(r.data.target_words, ['cat','pig','sit'], 'targets');
    eq(r.data.grid[0], ['c','a','t','p'], 'row[0] lowercased');
    eq(r.data.grid.length, 4, 'grid rows');
    eq(r.templateMeta.templateId, 'T-FINDWORD', 'templateId');
  });

  runner.check('Unknown matchType → T-MATCH › (unknown matchType: foo)', () => {
    const page = {
      pageNumber: 99, instructionText: 'matching',
      englishLetterTopicList: [
        { topicType:'english_matching', matchType:'foo', topItems:[{id:'t1',value:'x'}], bottomItems:[{id:'b1',value:'x'}], correctPairs:['t1-b1'] }
      ]
    };
    const r = T(page, {}, 'K-1_U01', 'K');
    eq(r.templateMeta.templateId, 'T-MATCH', 'templateId');
    eq(r.templateMeta.variantNumber, null, 'variantNumber');
    assert(/unknown matchType: foo/.test(r.templateMeta.variantName), 'variantName mentions unknown');
  });

  runner.check('instructionKey at page-root → ctx.instructionAudio = "<key>.mp3"', () => {
    const page = {
      pageNumber: 99,
      instructionText: 'Look at the picture. Write the word.',
      instructionKey: 'look_at_the_picture_write_the_word',
      englishLetterTopicList: [
        { topicType: 'english_picture_spelling', word: 'cat', answer: 'cat' }
      ]
    };
    const r = T(page, {}, 'K-1a_U01', 'K');
    eq(r.ctx.instructionAudio, 'look_at_the_picture_write_the_word.mp3', 'instructionAudio is filename');
  });

  runner.check('onset_rime_blend uses onset_phoneme_id + rime_id for audio filenames', () => {
    const page = {
      pageNumber: 3,
      instructionText: 'Tap each sound.',
      instructionKey: 'tap_each_sound_blend_them_together_write_the_word',
      englishLetterTopicList: [{
        topicType: 'english_onset_rime_blend',
        rows: [
          { word:'cat', imageName:'cat', onset:'c', rime:'at',
            onset_phoneme_id:'onset_k', rime_id:'at', answer:'cat' },
          { word:'hat', imageName:'hat', onset:'h', rime:'at',
            onset_phoneme_id:'onset_h', rime_id:'at', answer:'hat' }
        ]
      }]
    };
    const r = T(page, {}, 'K-1a_U01', 'K');
    eq(r.data.items[0].phoneme_audios, ['onset_k.mp3', 'at.mp3'], 'row 0 uses *_id audio filenames');
    eq(r.data.items[0].phoneme_labels, ['/c/', '/at/'], 'row 0 keeps grapheme labels');
    eq(r.data.items[1].phoneme_audios, ['onset_h.mp3', 'at.mp3'], 'row 1');
  });

  runner.check('phoneme_blend_picture uses phoneme_ids when present', () => {
    const page = {
      pageNumber: 3,
      instructionText: 'Listen.',
      englishLetterTopicList: [{
        topicType: 'english_phoneme_blend_picture',
        rows: [
          { word:'hit', imageName:'hit',
            phonemes:['h','i','t'], phoneme_ids:['onset_h','short_i','onset_t'], answer:'hit' }
        ]
      }]
    };
    const r = T(page, {}, 'K-1a_U04', 'K');
    eq(r.data.items[0].phoneme_audios, ['onset_h.mp3', 'short_i.mp3', 'onset_t.mp3'], 'audio uses phoneme_ids');
    eq(r.data.items[0].phoneme_labels, ['/h/', '/i/', '/t/'], 'labels keep graphemes');
  });

  runner.check('phoneme_blend_picture falls back to graphemes when phoneme_ids absent', () => {
    const page = {
      pageNumber: 3, instructionText: 'Listen.',
      englishLetterTopicList: [{
        topicType: 'english_phoneme_blend_picture',
        rows: [{ word:'sit', imageName:'sit', phonemes:['s','i','t'], answer:'sit' }]
      }]
    };
    const r = T(page, {}, 'K-1a_U05', 'K');
    eq(r.data.items[0].phoneme_audios, ['s.mp3', 'i.mp3', 't.mp3'], 'fallback to graphemes');
  });

  runner.check('instructionKey at topic-level falls back when missing on page', () => {
    const page = {
      pageNumber: 99,
      instructionText: 'Pick a word.',
      englishLetterTopicList: [
        {
          topicType: 'english_word_bank_cloze',
          instructionKey: 'pick_a_word_from_the_word_bank_write_it_in_the_blank',
          wordBank: [{ text: 'cat' }],
          rows: [{ sentence: 'I see a ___.', answer: 'cat' }]
        }
      ]
    };
    const r = T(page, {}, 'K-1a_U02', 'K');
    eq(r.ctx.instructionAudio, 'pick_a_word_from_the_word_bank_write_it_in_the_blank.mp3', 'falls back to topic-level key');
  });

  runner.check('initial_sound_spelling → T-WRITE v1 with prefill (1 blank + rest filled)', () => {
    const r = T(PAGES.initialSound, {}, 'PK-2a_U04', 'PreK');
    eq(r.kind, 'legacy', 'kind');
    eq(r.templateId, 'T-WRITE', 'templateId (internal renderer key)');
    eq(r.variant, 'v1', 'variant');
    eq(r.data.items.length, 4, 'items.length');
    // banana → answer 'b' is first letter, prefill is ['', 'a','n','a','n','a']
    eq(r.data.items[0].answer, 'banana', 'item[0].answer is full word');
    eq(r.data.items[0].prefill, ['','a','n','a','n','a'], 'item[0].prefill');
    eq(r.data.items[0].prompt_image, 'banana.webp', 'item[0].prompt_image');
    eq(r.data.items[0].prompt_audio, 'banana.mp3', 'item[0].prompt_audio');
    // duck → answer 'd', prefill ['', 'u','c','k']
    eq(r.data.items[2].answer, 'duck', 'item[2].answer');
    eq(r.data.items[2].prefill, ['','u','c','k'], 'item[2].prefill');
    eq(r.templateMeta,
      { templateId: 'T-SPELL', variantNumber: 1, variantName: 'Initial Sound Spelling (4 Cells)' },
      'templateMeta');
  });

  runner.check('initial_sound_spelling default instruction applies when text/key missing', () => {
    const page = JSON.parse(JSON.stringify(PAGES.initialSound));
    delete page.instructionText;
    delete page.instructionKey;
    const r = T(page, {}, 'PK-2a_U04', 'PreK');
    eq(r.ctx.instructionText,
      'Look at the picture. Listen to the word. Write the first letter.',
      'falls back to TOPIC_DEFAULT_INSTR');
  });

  runner.check('circle_picture correctAnswer (single-string) fallback → row.correct = [answer]', () => {
    const r = T(PAGES.circlePictureSingle, {}, 'PK-2a_U02', 'PreK');
    eq(r.kind, 'circle_multi', 'kind');
    eq(r.rows.length, 1, 'rows.length');
    eq(r.rows[0].options.length, 6, 'options count');
    eq(r.rows[0].correct, ['dog'], 'correct derived from correctAnswer');
    eq(r.templateMeta.variantNumber, 1, 'variantNumber 1 (Circle Picture by Sound, single)');
  });

  runner.done();
  </script>
</body>
</html>
